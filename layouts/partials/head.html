<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="index, follow" />
	<meta name="googlebot" content="index, follow, noarchive" />
	<title>{{ .Title }} | {{ .Site.Title }}</title>
	<link rel="icon" href="{{ .Site.BaseURL }}{{ .Site.Params.favicon }}" />
	<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
	<link rel="canonical" href="{{ .Permalink }}" />

	{{ hugo.Generator }}

	{{ if .Site.GoogleAnalytics }}
	{{ template "_internal/google_analytics.html" . }}
	{{ end }}

	{{ template "_internal/twitter_cards.html" . }}
	{{ template "_internal/opengraph.html" . }}

	<script type="application/ld+json">
	{
	  "@context": "https://schema.org",
	  "@type": "Dentist",
	  "name": "Dra. Ana Paula Carneiro",
	  "url": "{{ .Site.BaseURL }}",
	  "email": "{{ .Site.Params.contact.email }}",
	  "telephone": "{{ .Site.Params.contact.phone }}",
	  "address": {
	    "@type": "PostalAddress",
	    "addressLocality": "{{ .Site.Params.clinic.city }}",
	    "addressRegion": "{{ .Site.Params.clinic.region }}",
	    "addressCountry": "BR"
	  }
	}
	</script>

	{{ partial "styles.html" . }}
</head>
