baseurl = "https://anapaulacarneiro.com.br/"
title = "Dra. Ana Paula Carneiro | Clínica Odontológica em Fortaleza"
author = "Dra. Ana Paula Carneiro"
googleAnalytics = ""
defaultContentLanguage = "pt-br"
language = "pt-BR"
paginate = 6

theme = "hugo-terrassa-theme"
themesDir = "../.." # Not necessary on production sites

[params]
    description = "Clínica odontológica em Fortaleza com foco em implantes, estética dental e prevenção para toda a família."
    favicon = "favicon.ico"
    logo = ""

[params.hero]
    textColor = "" # Empty for default color

[params.cta] # Call To Action
    show = true
    cta = "Agendar avaliação no WhatsApp"
    link = "contato" # Relative URL

[params.separator] # Separators between sections on the home page
    show = false

[params.fa] # Font Awesome options
    version = "5.7.2"
    integrity = "sha384-0pzryjIRos8mFBWMzSSZApWtPl/5++eIfzYmTgBBmXYdhvxPc+XcFEk+zJwDgWbP"

[params.form] # Contact form
    netlify = true
    action = "https://formspree.io/f/mayvlbzb"
    method = "POST"
    inputNameName = "name"
    inputNameLabel = "Nome"
    inputNamePlaceholder = "Seu nome completo"
    inputEmailName = "email"
    inputEmailLabel = "E-mail"
    inputEmailPlaceholder = "Seu melhor e-mail"
    inputMsgName = "message"
    inputMsgLabel = "Como podemos ajudar?"
    inputMsgLength = 750
    inputSubmitValue = "Quero agendar"

[params.posts]
    showAuthor = true
    showDate = true
    showTags = true
    dateFormat = "02/01/2006"

[params.contact] # Contact info
    email = "contato@anapaulacarneiro.com.br"
    phone = "(85) 3333-2222"
    skype = ""
    address = "Fortaleza - CE"

[params.social]
    twitter = ""
    facebook = ""
    github = ""
    gitlab = ""
    codepen = ""
    instagram = "https://www.instagram.com/dra.anapaulacarneiro"
    pinterest = ""
    youtube = ""
    linkedin = ""
    weibo = ""
    mastodon = ""
    tumblr = ""
    flickr = ""
    "500px" = ""

[params.clinic]
    city = "Fortaleza"
    region = "CE"
    whatsapp = "558533332222"

[params.copy] # Copyright
    copy = "© {{ now.Year }} Dra. Ana Paula Carneiro. Todos os direitos reservados."

[privacy]
    [privacy.googleAnalytics]
        anonymizeIP = true
        disable = false
        respectDoNotTrack = true
        useSessionStorage = false
    [privacy.instagram]
        disable = false
        simple = false
    [privacy.twitter]
        disable = false
        enableDNT = true
        simple = false
    [privacy.vimeo]
        disable = false
        simple = false
    [privacy.youtube]
        disable = false
        privacyEnhanced = true
